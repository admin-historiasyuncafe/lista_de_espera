<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historias y un café - Lista de Espera</title>
    <link rel="stylesheet" href="style.css">
    <link rel="apple-touch-icon" href="app_icon_le.png">
    <link rel="icon" type="image/png" href="app_icon_le.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Lista de Espera - Historias">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <button id="theme-toggle" class="theme-toggle-btn" title="Cambiar modo">☀️</button>
            </div>
            <div class="logo-container">
                <img id="app-logo" src="logo_dark.png" alt="Historias y un café" class="brand-logo">
            </div>
            <h1>Lista de Espera</h1>
        </header>

        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-label">Esperando</span>
                <span id="waiting-count" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Notificados</span>
                <span id="notified-count" class="stat-value">0</span>
            </div>
        </div>

        <button id="add-guest-btn" class="main-btn">+ Nuevo Registro</button>

        <div class="search-container">
            <input type="text" id="search-input" placeholder="🔍 Buscar por nombre..." class="search-input">
        </div>
        
        <nav class="tabs">
            <button class="tab-btn active" data-view="active">En Espera</button>
            <button class="tab-btn" data-view="history">Historial del Día</button>
        </nav>

        <div id="history-filter-container" class="hidden">
            <label for="history-date-picker">🗓️ Ver otro día:</label>
            <input type="date" id="history-date-picker">
        </div>

        <div id="waitlist-container">
            <!-- Data will be injected here -->
        </div>

        <div id="modal-container" class="hidden"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
